name: MobDespawnFix
version: '${version}'
main: io.github.derec4.mobdespawnfix.MobDespawnFix
api-version: '1.21'
authors: [ DerexXD ]
description: Inspired by Let me Despawn (LMD), this plugin aims to optimize servers by despawning mobs cluttering the world by holding items.

commands:
  mobdespawnfix:
    description: Main command for Mob Despawn Fix
    usage: /mobdespawnfix <subcommand>
    aliases: [mdf, ddespawn]
    permission: mobdespawnfix.use
